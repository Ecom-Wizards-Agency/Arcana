name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / lint / test / hygiene
    runs-on: ubuntu-latest
    services:
      # Historical catalog evidence includes cluster-global roles. It needs a
      # fresh cluster independent of the current-schema integration suites.
      postgres-history:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The hygiene lint reads the tracked file list from git, so it needs a
          # real working tree (a shallow clone is fine, a sparse one is not).
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install deployment test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Verify Evo report-worker deployment
        run: bash docs/deploy/test-report-worker-evo-systemd.sh

      - name: Verify MCP deployment
        run: bash docs/deploy/test-mcp-evo-systemd.sh

      - name: Verify recommendation-worker deployment
        run: node docs/deploy/test-recommendation-worker-deployment.mjs

      - name: Verify Evo general-worker deployment
        run: bash docs/deploy/test-evo-general-worker-deployment.sh

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Apply and verify migrations
        run: pnpm --filter @wizard-ads/db exec vitest run src/migrations.test.ts --maxWorkers=1
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Test
        # Turbo serializes package tasks; arguments after `--` are forwarded to
        # each Vitest task so test files cannot contend for the one Postgres service.
        # UI keeps its own dedicated, single-worker performance-test invocation.
        run: |
          pnpm exec turbo run test --filter=!@wizard-ads/ui --concurrency=1 -- --maxWorkers=1
          pnpm --filter @wizard-ads/ui run test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          WIZARD_ADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          WP197_EXACT_HISTORY_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres

      - name: Hygiene (public-repo gate)
        run: pnpm run hygiene

      - name: Skill contracts
        run: pnpm run skill-lint

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      WIZARD_ADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply and verify migrations
        run: pnpm --filter @wizard-ads/db exec vitest run src/migrations.test.ts --maxWorkers=1

      - name: Install Chromium
        run: pnpm --filter @wizard-ads/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm --filter @wizard-ads/web run build

      - name: Test e2e (serial)
        # e2e/run.ts executes the fourteen registered database-owning suites in
        # order (src/e2e-suite-registry.ts), including undesigned-routes; every
        # Playwright config also pins workers to one. Large route sweeps and
        # stateful workflows get fresh processes, so Next dev releases retained
        # route graphs between bounded suites.
        run: pnpm --filter @wizard-ads/web run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/node_modules/.cache/playwright/reports
          if-no-files-found: ignore

      - name: Upload counted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-counts
          path: apps/web/node_modules/.cache/playwright/e2e-summary-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  auth-acceptance:
    name: Auth and onboarding acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @wizard-ads/web exec playwright install --with-deps chromium

      - name: Resolve pinned Auth harness images
        id: auth-images
        # The cache key is derived from the four digest pins in stack.mjs, so
        # changing a pin changes the key and the next run pulls afresh.
        run: |
          list="$(node --input-type=module -e "import { images } from './tools/auth-acceptance/stack.mjs'; console.log(Object.values(images).join(' '))")"
          test "$(printf '%s\n' $list | grep -c '@sha256:')" -eq 4
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "names=$(printf '%s\n' $list | sed 's/:[^/@]*@/@/' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "platform=linux/$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
          echo "key=auth-acceptance-images-${{ runner.os }}-$(printf '%s' "$list" | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
          printf 'tarball=%s/auth-acceptance-images.tar\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"

      - name: Use the containerd image store
        # docker save/load drops digest references, so a loaded image would not
        # satisfy the harness's inspect-by-digest check. containerd export and
        # import keep them; that needs Docker's containerd image store.
        run: |
          (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') | jq '.features["containerd-snapshotter"] = true' > "$RUNNER_TEMP/daemon.json"
          sudo cp "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1

      - name: Restore Auth harness images
        id: auth-images-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.auth-images.outputs.tarball }}
          key: ${{ steps.auth-images.outputs.key }}

      - name: Load cached Auth harness images
        if: steps.auth-images-cache.outputs.cache-hit == 'true'
        # A failed load leaves the harness to pull, with its rate-limit retry.
        continue-on-error: true
        run: |
          sudo ctr --address /run/containerd/containerd.sock --namespace moby images import --platform "${{ steps.auth-images.outputs.platform }}" "${{ steps.auth-images.outputs.tarball }}"
          for image in ${{ steps.auth-images.outputs.list }}; do docker image inspect "$image" > /dev/null; done

      - name: Pull and export Auth harness images
        id: auth-images-pull
        if: steps.auth-images-cache.outputs.cache-hit != 'true'
        # Pulls through the harness, including its rate-limit retry. If this
        # fails, the harness step below pulls again and reports the failure.
        continue-on-error: true
        run: |
          node --input-type=module -e "import { prepareImages } from './tools/auth-acceptance/stack.mjs'; prepareImages()"
          sudo ctr --address /run/containerd/containerd.sock --namespace moby images export --platform "${{ steps.auth-images.outputs.platform }}" "${{ steps.auth-images.outputs.tarball }}" ${{ steps.auth-images.outputs.names }}
          sudo chown "$(id -u):$(id -g)" "${{ steps.auth-images.outputs.tarball }}"

      - name: Cache Auth harness images
        if: steps.auth-images-pull.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.auth-images.outputs.tarball }}
          key: ${{ steps.auth-images.outputs.key }}

      - name: Verify actual Auth, mail and onboarding
        # The harness owns fresh internal Docker networks and random loopback
        # ports. It never reads hosted credentials or the other jobs' databases.
        # Missing Docker, images, Chromium, services or checks fail the job.
        run: |
          node --test tools/auth-acceptance/support.test.mjs tools/auth-acceptance/stack.test.mjs
          node tools/auth-acceptance/run.mjs

      - name: Upload sanitized Auth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-acceptance
          path: node_modules/.cache/auth-acceptance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
